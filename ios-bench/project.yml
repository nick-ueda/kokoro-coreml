# XcodeGen spec for the iPhone benchmark app.
#
# Builds a headless SwiftUI app that runs the same pre-tokenized bakeoff
# inputs (Resources/bench_inputs/*.json, generated by
# scripts/prepare_swift_bench_inputs.py) through two TTS arms:
#   1. KokoroPipeline   — this repo's Swift + Core ML/ANE pipeline
#   2. KokoroSwift      — mlalma/kokoro-ios, the MLX Swift port of Kokoro
# and writes warm-median timings to Documents/results.json.
#
# Regenerate the project with: xcodegen generate --spec project.yml
name: KokoroIPhoneBench
options:
  # Local spike fork: signed with Nick's team / bundle prefix (upstream:
  # com.mattmireles / 6ETYBAJKY8).
  bundleIdPrefix: com.nickueda
  deploymentTarget:
    iOS: "18.0"
packages:
  KokoroPipeline:
    path: ../swift
  # Vendored at tag 1.0.8 (cd7f5f3) with one patch: Package.swift declares
  # the MLXFast product that LayerNormInference.swift imports. Upstream
  # builds under bare SwiftPM but fails Xcode's explicit-module build.
  KokoroSwift:
    path: Vendor/kokoro-ios
  # Direct dependency for NpyzReader (loads voices.npz in the app). Same URL
  # and version kokoro-ios pins, so SPM resolves a single copy.
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: 0.0.6
# Declared scheme so `xcodegen generate` always recreates it (scheme-based
# builds are what resolve the SPM package graph).
schemes:
  KokoroIPhoneBench:
    build:
      targets:
        KokoroIPhoneBench: all
    run:
      config: Debug
      # Baked in so regeneration stops wiping the manually-entered launch
      # args. One entry; Xcode tokenizes it on whitespace at launch. Edit in
      # Xcode (Scheme → Run → Arguments) for other modes/buckets.
      commandLineArguments:
        "--mode soak --keys 7s --soak-seconds 900 --out soak.json": true
targets:
  KokoroIPhoneBench:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # .mlpackage entries compile to .mlmodelc in the app bundle root.
      - path: Resources/coreml
        type: group
        buildPhase: resources
      - path: Resources/bench_inputs
        type: group
        buildPhase: resources
      - path: Resources/mlx
        type: group
        buildPhase: resources
    dependencies:
      - package: KokoroPipeline
        product: KokoroPipeline
      - package: KokoroSwift
        product: KokoroSwift
      - package: MLXUtilsLibrary
        product: MLXUtilsLibrary
    # Explicit Info.plist (generated by xcodegen from these properties)
    # instead of GENERATE_INFOPLIST_FILE: soak mode needs
    # UIBackgroundModes=audio so the process keeps running — synthesizing —
    # while the screen is locked.
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        # Expose Documents (soak-*.csv, soak.json, launch_args.txt) in the
        # Files app so untethered soak runs can be configured and their
        # telemetry pulled without a Mac.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    # NOTE: com.apple.developer.kernel.increased-memory-limit would raise the
    # ~2.1 GB per-app ceiling on this 4 GB phone, but it needs a paid team
    # with the capability provisioned — it can't be signed with the personal
    # "Apple Development: Nick Ueda" identity. Left off: the backgroundSafe
    # policy (duration/F0/generator pinned to CPU, no doomed ANE compiles) is
    # the actual jetsam fix. Add back only if backgroundSafe still gets
    # memory-killed AND a paid team is available.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickueda.KokoroIPhoneBench
        # LHR59PW4LW is the team the working Test 1/2 installs used (matches
        # the app already on the device). Pinned so regeneration stops
        # resetting it and breaking the upgrade with a team-prefix mismatch.
        DEVELOPMENT_TEAM: LHR59PW4LW
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        # Don't generate Swift classes for the bundled Core ML models;
        # the app loads them by URL through KokoroModelProvider.
        COREML_CODEGEN_LANGUAGE: None
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
